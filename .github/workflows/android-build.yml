name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install Dependencies
        working-directory: ./mobile-app
        run: npm ci || npm install
        
      - name: Build Next.js App
        working-directory: ./mobile-app
        run: npm run build
        
      - name: Sync Capacitor
        working-directory: ./mobile-app
        run: npx cap sync android
        
      - name: Build Debug APK
        working-directory: ./mobile-app/android
        run: ./gradlew assembleDebug
        
      - name: Build Release Bundle (Unsigned)
        working-directory: ./mobile-app/android
        run: ./gradlew bundleRelease
        
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload Unsigned Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
